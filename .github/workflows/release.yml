name: Release Foundry module

on:
  push:
    branches: ['**']
    paths:
      - module.json
      - README.md
      - scripts/**
      - styles/**
      - assets/**
      - templates/**
      - lang/**
      - fonts/**
      - package.mjs
      - test/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish_versioned:
        description: 'Publish this reviewed branch as a versioned release before promoting the stable manifest'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: viscanon-foundry-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      manifest_changed: ${{ steps.manifest_change.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native browser test tooling
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Check native browser receivers and delivery
        env:
          VISCANON_LEGACY_REF: 78699556735041133f12884826a362158ed21146
        run: node --test test/*.test.mjs
      - name: Validate the module-only archive
        run: node package.mjs "$RUNNER_TEMP/viscanon-validation/viscanon-bridge.zip"
      - name: Detect a stable manifest change
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: manifest_change
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- module.json; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: verify
    if: >-
      github.repository == 'stephenczaja/viscanon-foundry' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_versioned == true && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.manifest_changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the module-only archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          node --check package.mjs
          node package.mjs "$RUNNER_TEMP/viscanon-release/viscanon-bridge.zip"
          cp module.json "$RUNNER_TEMP/viscanon-release/module.json"
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('module.json', 'utf8')).version")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          node --input-type=module > "$RUNNER_TEMP/viscanon-release/notes.md" <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('module.json', 'utf8'));
          const {minimum, maximum} = manifest.compatibility;
          const versions = minimum === maximum ? minimum : `${minimum}–${maximum}`;
          console.log(`Viscanon ${manifest.version} for Foundry VTT ${versions}.\n`);
          console.log(`Install using the stable manifest URL:\n${manifest.manifest}`);
          NODE
      - name: Stage a new version before changing the stable manifest
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" > /dev/null 2>&1; then
            printf '::error::Release %s already exists. Increment module.json version; existing assets will not be changed.\n' "$tag"
            exit 1
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" > /dev/null 2>&1; then
            printf '::error::Tag %s already exists. Resolve it separately or choose a new version.\n' "$tag"
            exit 1
          fi
          # gh attaches both assets before publishing, including with release immutability enabled.
          gh release create "$tag" \
            "$RUNNER_TEMP/viscanon-release/viscanon-bridge.zip" \
            "$RUNNER_TEMP/viscanon-release/module.json" \
            --target "$RELEASE_COMMIT" \
            --title "Viscanon ${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/viscanon-release/notes.md"
      - name: Verify published assets are exactly this source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          downloaded="$RUNNER_TEMP/viscanon-published"
          mkdir -p "$downloaded"
          gh release download "$tag" --pattern 'viscanon-bridge.zip' --dir "$downloaded"
          gh release download "$tag" --pattern 'module.json' --dir "$downloaded"
          cmp "$RUNNER_TEMP/viscanon-release/viscanon-bridge.zip" "$downloaded/viscanon-bridge.zip"
          cmp "$RUNNER_TEMP/viscanon-release/module.json" "$downloaded/module.json"
          sha256sum "$downloaded/viscanon-bridge.zip" "$downloaded/module.json"
